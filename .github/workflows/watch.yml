name: watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes eslint .
      - run: npm test

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan every collector
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: node scripts/health-check.js
      - name: Heal what has been broken twice
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: node scripts/repair.js || true
      - name: Commit the scan
        run: |
          git config user.email "ci@thwip.local"
          git config user.name "thwip watch"
          git add data/
          if git diff --staged --quiet; then
            echo "no change this scan"
          else
            git commit -m "data: scan $(date -u +%FT%TZ)"
            git push
          fi

  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Count the tests
        run: |
          set -euo pipefail
          node test/run.js --test-reporter=tap > tap.txt
          count=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' tap.txt | head -1)
          if [ -z "$count" ] || [ "$count" -le 0 ]; then
            echo "could not read a pass count out of the TAP output" >&2
            tail -20 tap.txt >&2
            exit 1
          fi
          human=$(TZ=UTC git log -1 --date=iso-strict-local --format=%cd \
            --perl-regexp --author='^(?!thwip watch)' || true)
          if [ -n "$human" ]; then
            printf '{\n  "tests": %s,\n  "sha": "%s",\n  "generated_at": "%s",\n  "last_human_ts": "%s"\n}\n' \
              "$count" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$human" > data/meta.json
          else
            printf '{\n  "tests": %s,\n  "sha": "%s",\n  "generated_at": "%s"\n}\n' \
              "$count" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > data/meta.json
          fi
          cat data/meta.json
      - name: Assemble the site
        run: |
          mkdir -p public
          cp -r web/* public/
          cp -r data public/
          cp -r demo-target public/
          cp -r assets public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
