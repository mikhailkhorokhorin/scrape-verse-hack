name: ci

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint and tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: There are no dependencies, and that is a claim we check
        run: |
          set -euo pipefail
          test ! -d node_modules || { echo "node_modules is committed" >&2; exit 1; }
          node -e '
            const p = require("./package.json");
            const dep = Object.keys(p.dependencies || {});
            const dev = Object.keys(p.devDependencies || {});
            if (dep.length || dev.length) {
              console.error("dependencies appeared: " + dep.concat(dev).join(", "));
              process.exit(1);
            }
            console.log("zero dependencies, zero devDependencies");
          '

      - name: Lint
        run: npx --yes eslint .

      - name: Tests
        run: |
          set -euo pipefail
          node test/run.js --test-reporter=tap > tap.txt || { tail -40 tap.txt; exit 1; }
          count=$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' tap.txt | head -1)
          fail=$(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' tap.txt | head -1)
          echo "$count passing, $fail failing"
          [ "${fail:-1}" = "0" ] || { tail -40 tap.txt; exit 1; }
          echo "### $count tests passing on node ${{ matrix.node }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Every file stays under the line cap
        run: |
          set -euo pipefail
          over=$(find . \( -name '*.js' -o -name '*.css' \) \
            -not -path './node_modules/*' -not -path './.git/*'             -not -path './.playwright-mcp/*' \
            -exec awk 'END { if (NR > 250) print FILENAME " " NR }' {} \;)
          if [ -n "$over" ]; then
            echo "over 250 lines:" >&2
            echo "$over" >&2
            exit 1
          fi
          echo "no file over 250 lines"

      - name: The numbers on the page are the numbers in the repo
        run: node tools/numbers-audit.js
